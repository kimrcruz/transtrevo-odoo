<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transtrevo CRM e Operações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* layout: barra de filtros fixa, três secções empilhadas (comercial, operações, direcção), kanbans em grelha */
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1b2433; --muted:#5d6878; --line:#dde1e7; --accent:#1f3864;
  --ok-bg:#dcf1dc; --ok-fg:#1e5e22; --run-bg:#dbe8f6; --run-fg:#1d4775; --warn-bg:#fdf0c2; --warn-fg:#7a5600;
  --late-bg:#fbe2d2; --late-fg:#8a3d0f; --bad-bg:#fbdde0; --bad-fg:#8f1d27; --off-bg:#e9eaed; --off-fg:#545a63;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1b212b; --ink:#e7eaef; --muted:#9aa4b2; --line:#2c3441; --accent:#8fb2e8;
  --ok-bg:#1d3a22; --ok-fg:#9fdba5; --run-bg:#1b3150; --run-fg:#a9c8f0; --warn-bg:#3d3313; --warn-fg:#f1d27a;
  --late-bg:#432716; --late-fg:#f2b58c; --bad-bg:#45191f; --bad-fg:#f3a3ab; --off-bg:#2a2f37; --off-fg:#b4bac4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1b212b; --ink:#e7eaef; --muted:#9aa4b2; --line:#2c3441; --accent:#8fb2e8;
  --ok-bg:#1d3a22; --ok-fg:#9fdba5; --run-bg:#1b3150; --run-fg:#a9c8f0; --warn-bg:#3d3313; --warn-fg:#f1d27a;
  --late-bg:#432716; --late-fg:#f2b58c; --bad-bg:#45191f; --bad-fg:#f3a3ab; --off-bg:#2a2f37; --off-fg:#b4bac4; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:600} h2{font-size:20px;font-weight:600;color:var(--accent)} h3{font-size:15px;font-weight:600}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
header{padding:20px 0 8px}
header p{margin:4px 0 0;color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
nav a{color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:999px;font-weight:500}
nav a:hover,nav a:focus-visible{border-color:var(--accent)}
.filters[hidden]{display:none}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.filters .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:120px}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.reset{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 12px}
section{padding:22px 0 8px}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.sechead p{margin:0;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--muted)} .tile .v{font:600 24px/1.2 var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.tile.clk{cursor:pointer}.tile.clk:hover{border-color:var(--accent)}.tile.clk:focus-visible{outline:2px solid var(--accent)}
.tile .fx{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.35}
.tile.warn{border-left:4px solid var(--warn-fg)} .tile.late{border-left:4px solid var(--late-fg)}
.kanban{display:grid;grid-template-columns:repeat(var(--cols),minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.col h3{padding:8px 10px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;gap:8px}
.col .hsum{padding:0 10px 8px;display:flex;flex-direction:column;font-size:12px;margin-top:-4px}
.col .hsum b{font:600 17px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.col .hsum span{opacity:.85}
.col h3{padding-bottom:4px}
.col .cards{padding:8px;display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.card{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--panel)}
.plist{display:grid;gap:6px;margin:4px 0 6px} .pp{border:1px solid var(--line);border-radius:6px;padding:6px 8px} .pn{font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap} .small{font-size:11px} .card .t{font-weight:500;overflow-wrap:anywhere} .card .m{grid-column:1/-1;color:var(--muted);font-size:11px;border-top:1px dashed var(--line);padding-top:3px;margin-top:2px} .card .s{grid-column:1;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.card .n{grid-row:1/span 2;grid-column:2;align-self:center;font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;white-space:nowrap}
.card .n .nv{font-weight:600} .card .n .nd{font-weight:400;color:var(--muted);font-size:11px;text-align:right}
.card.stale{border-left:4px solid var(--warn-fg);background:var(--warn-bg)}
.more{margin:0 8px 8px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px}
.empty{color:var(--muted);font-size:12px;padding:6px 2px}
.s-ok{background:var(--ok-bg);color:var(--ok-fg)} .s-run{background:var(--run-bg);color:var(--run-fg)} .s-warn{background:var(--warn-bg);color:var(--warn-fg)}
.s-late{background:var(--late-bg);color:var(--late-fg)} .s-bad{background:var(--bad-bg);color:var(--bad-fg)} .s-off{background:var(--off-bg);color:var(--off-fg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.panel h3{margin-bottom:8px}
.chart{position:relative;height:280px} .chart.tall{height:360px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px;opacity:.75}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500}
.note{color:var(--muted);font-size:12px;margin:4px 0 0}
footer{color:var(--muted);font-size:12px;padding:20px 0 40px}

.topbar{background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-top:12px;padding-bottom:12px}
.brand{font:600 18px/1.2 var(--f-display);color:var(--ink);margin-right:auto}
.brand small{display:block;font:400 12px var(--f-body);color:var(--muted)}
.menu{display:flex;flex-wrap:wrap;gap:6px}
.menu a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--bg);padding:6px 14px;border-radius:999px;font-weight:500;font-size:14px}
.menu a:hover{border-color:var(--accent)}
.menu a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.menu a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view[hidden]{display:none}
.lead{max-width:72ch;color:var(--muted)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin:12px 0 18px}
.icard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.icard h3{margin-bottom:4px} .icard p{margin:0;color:var(--muted);font-size:14px}
a.icard{text-decoration:none;color:var(--ink);display:block} a.icard:hover{border-color:var(--accent)}
a.icard .go{color:var(--accent);font-weight:600;font-size:13px;margin-top:8px;display:block}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
.flow .s{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:500}
.flow .a{color:var(--muted)}
.dtbl{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto;margin-bottom:18px}
.dtbl table td,.dtbl table th{text-align:left;white-space:normal;vertical-align:top;padding:8px 10px}
.dtbl tr:last-child td{border-bottom:0}
.pill{margin:2px 3px 2px 0}
.qlist{counter-reset:q;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.qlist li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 44px;position:relative}
.qlist li::before{counter-increment:q;content:counter(q);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--run-bg);color:var(--run-fg);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center}
.qlist b{display:block}
.qlist span{color:var(--muted);font-size:13px}

.card{cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)} .card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ov{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.ov[hidden]{display:none}
.md{background:var(--panel);color:var(--ink);max-width:780px;width:100%;border-radius:12px;border:1px solid var(--line);padding:18px 20px}
.md .mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.md .mh h3{font-size:20px}
.md .mh>div:first-child{margin-right:auto}
.md .kind{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.md .x{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px}
.md dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;margin:8px 0 14px}
.md dt{font-size:12px;color:var(--muted)} .md dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.md h4{font:600 14px var(--f-display);margin:14px 0 6px;color:var(--accent)}
.md .lst{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow-y:auto}
.md .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.md .row:last-child{border-bottom:0}
.md .row.link{cursor:pointer} .md .row.link:hover{background:var(--bg)}
.md .lk{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:5px 12px;font-weight:500;margin-right:6px}
.md .muted{color:var(--muted);font-size:13px}
#tb-top tbody tr{cursor:pointer} #tb-top tbody tr:hover td{background:var(--bg)}

.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px;margin-bottom:16px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0;display:flex;flex-direction:column}
.act .ah{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.act .ah h3{font-size:16px}
.act .why{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.act .tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
.act .lst{border:1px solid var(--line);border-radius:6px}
.act .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;align-items:center;cursor:pointer}
.act .row:last-child{border-bottom:0} .act .row:hover{background:var(--bg)} .act .row:focus-visible{outline:2px solid var(--accent)}
.act .row .a{overflow-wrap:anywhere} .act .row .b{color:var(--muted);font-size:12px;text-align:right} .act .row .c{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.act .all{margin-top:8px;align-self:flex-start;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:6px;padding:4px 12px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="gate" style="min-height:100vh;display:grid;place-items:center;padding:24px">
<form id="gf" style="width:min(360px,100%);border:1px solid var(--line,#ddd);border-radius:10px;padding:24px;background:var(--panel,#fff)">
<div style="font-size:12px;color:var(--muted,#666);text-transform:uppercase;letter-spacing:.06em">KIMIKA · Transtrevo</div>
<h1 style="font-size:20px;margin:6px 0 4px">Protótipo CRM e OPS</h1>
<p style="color:var(--muted,#666);margin:0 0 16px;font-size:14px">Acesso reservado. Introduza o código de acesso.</p>
<label for="gp" style="font-size:13px">Código de acesso</label>
<input id="gp" type="password" autocomplete="current-password" required style="display:block;width:100%;box-sizing:border-box;margin:4px 0 12px;padding:9px 10px;border:1px solid var(--line,#ccc);border-radius:6px;font:inherit">
<button type="submit" style="width:100%;padding:9px;border:0;border-radius:6px;background:#1f4e79;color:#fff;font:inherit;cursor:pointer">Entrar</button>
<p id="ge" role="alert" style="color:#b42318;font-size:13px;min-height:18px;margin:10px 0 0"></p>
</form></div>
